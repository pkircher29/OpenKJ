name: macOS build test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: recursive

    - name: install deps
      run: brew install cmake ninja pkgconf cppunit utf8cpp qt gstreamer spdlog

    - name: Build
      env:
        LDFLAGS: "-L/opt/homebrew/opt/qt/lib"
        CPPFLAGS: "-I/opt/homebrew/opt/qt/include"
        PKG_CONFIG_PATH: "/opt/homebrew/opt/qt/lib/pkgconfig"
        CMAKE_PREFIX_PATH: "/opt/homebrew/opt/qt"
        QT_DIR: "/opt/homebrew/opt/qt/"
        Qt6_DIR: "/opt/homebrew/opt/qt/"
      run: |
        cmake . -B build -G Ninja
        ninja -C build
    - name: Upload app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: build/openkj.app
        name: openkj.app
