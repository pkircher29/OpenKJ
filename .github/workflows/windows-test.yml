name: Windows build test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Builds
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - windows-arch: 64
            bits: 64
            arch: x86_64
            msvcarch: x64
            qtarch: win64_msvc2019_64

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Download GST Installers
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path downloads | Out-Null
        # gstreamer.freedesktop.org periodically deletes old version directories,
        # so try known-good candidates in order instead of pinning a single URL.
        $candidates = @(
          @{ ver = '1.28.5';  flavor = 'msvc'  },
          @{ ver = '1.28.5';  flavor = 'mingw' },
          @{ ver = '1.26.11'; flavor = 'mingw' },
          @{ ver = '1.26.11'; flavor = 'msvc'  },
          @{ ver = '1.24.13'; flavor = 'mingw' }
        )
        $found = $false
        foreach ($c in $candidates) {
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$($c.ver)/$($c.flavor)"
          $runtime = "$base/gstreamer-1.0-$($c.flavor)-${{ matrix.arch }}-$($c.ver).msi"
          $devel = "$base/gstreamer-1.0-devel-$($c.flavor)-${{ matrix.arch }}-$($c.ver).msi"
          try {
            Write-Host "Trying GStreamer $($c.ver) ($($c.flavor))..."
            Invoke-WebRequest -Uri $runtime -OutFile downloads\gstreamer.msi
            Invoke-WebRequest -Uri $devel -OutFile downloads\gstreamer-devel.msi
            "GST_FLAVOR=$($c.flavor)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Using GStreamer $($c.ver) ($($c.flavor))"
            $found = $true
            break
          } catch {
            Write-Host "Not available: $($_.Exception.Message)"
          }
        }
        if (-not $found) { throw 'No GStreamer installer candidate could be downloaded' }

    - name: Install GST
      shell: powershell
      run: |
        start-process -wait msiexec -argumentlist '/q /i ${{ github.workspace }}\downloads\gstreamer.msi ADDLOCAL=ALL'
        start-sleep 10
        start-process -wait msiexec -argumentlist '/q /i ${{ github.workspace }}\downloads\gstreamer-devel.msi ADDLOCAL=ALL'
        start-sleep 10

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
       version: '6.7.2'
       arch: ${{ matrix.qtarch }}
       modules: 'qtsvg qttools'

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: ${{ matrix.msvcarch }}

    - name: Configure CMake
      shell: cmd
      working-directory: ${{github.workspace}}/build
      run: |
        cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja "-DGST_BASE_PATH=C:/Program Files/gstreamer/1.0/%GST_FLAVOR%_${{ matrix.arch }}"

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build .

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows ${{ matrix.arch }} binary
        path: build/openkj.exe
